name: Publish approved PHP 8.3 to GitHub
run-name: Publish PHP 8.3 ${{ inputs.ticket }}
on:
  push:
    branches: [feature/public-windows-publication-20261025]
  workflow_dispatch:
    inputs:
      ticket:
        type: string
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: public-windows-publication-${{ github.repository }}-8.3
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Publish approved package bytes
        env:
          GH_TOKEN: ${{ github.token }}
          PHP_SERIES: '8.3'
        run: python3 publication/publish.py publish "$PHP_SERIES"
      - name: Retain publication receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-8.3-${{ github.run_attempt }}
          path: receipts/
          if-no-files-found: warn
          retention-days: 90
  verify:
    if: github.event_name == 'workflow_dispatch'
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: publication-8.3-${{ github.run_attempt }}
          path: publication-receipts/
      - name: Download and verify published files
        env:
          GH_TOKEN: ${{ github.token }}
          PHP_SERIES: '8.3'
        run: python3 publication/publish.py verify "$PHP_SERIES"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-8.3-${{ github.run_attempt }}
          path: receipts/
          if-no-files-found: warn
          retention-days: 90
