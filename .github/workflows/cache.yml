name: Mirror GitHub release builds
run-name: Mirror published PHP ${{ inputs.php-versions }} builds — ${{ inputs.ticket }}
on:
  workflow_dispatch:
    inputs:
      ticket:
        description: Dispatch tracking identifier
        required: true
        type: string
      php-versions:
        description: 'Minor versions separated by spaces, or all (stable releases only)'
        required: true
        type: string
        default: all
permissions:
  contents: read
jobs:
  versions:
    if: github.repository == 'shivammathur/php-builder-windows'
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.select.outputs.versions }}
      shared_version: ${{ steps.select.outputs.shared_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: select
        env:
          PHP_VERSIONS: ${{ inputs.php-versions }}
        run: python3 scripts/mirror-github-release.py matrix
  mirror:
    name: Mirror PHP ${{ matrix.php }}
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.versions.outputs.versions) }}
    concurrency:
      group: php-builder-windows-release-mirror-${{ matrix.php }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install transfer clients
        run: |
          python3 -m venv "$RUNNER_TEMP/mirror-tools"
          "$RUNNER_TEMP/mirror-tools/bin/pip" install cloudsmith-cli
          echo "$RUNNER_TEMP/mirror-tools/bin" >> "$GITHUB_PATH"
      - name: Download and verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          PHP_VERSION: ${{ matrix.php }}
          SOURCE_VERSION: ${{ matrix.php }}
        run: python3 scripts/mirror-github-release.py download "$PHP_VERSION" "$RUNNER_TEMP/mirror" "$SOURCE_VERSION"
      - name: Upload and verify existing mirrors
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: python3 scripts/mirror-github-release.py publish "$RUNNER_TEMP/mirror"
      - name: Preserve transfer receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mirror-receipt-${{ matrix.php }}
          path: ${{ runner.temp }}/mirror/receipt.json
          if-no-files-found: warn
          retention-days: 30
  shared:
    name: Mirror shared installer scripts
    needs: [versions, mirror]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: php-builder-windows-release-mirror-shared
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install transfer clients
        run: |
          python3 -m venv "$RUNNER_TEMP/mirror-tools"
          "$RUNNER_TEMP/mirror-tools/bin/pip" install cloudsmith-cli
          echo "$RUNNER_TEMP/mirror-tools/bin" >> "$GITHUB_PATH"
      - name: Download and verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          PHP_VERSION: shared
          SOURCE_VERSION: ${{ needs.versions.outputs.shared_version }}
        run: python3 scripts/mirror-github-release.py download "$PHP_VERSION" "$RUNNER_TEMP/mirror" "$SOURCE_VERSION"
      - name: Upload and verify existing mirrors
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: python3 scripts/mirror-github-release.py publish "$RUNNER_TEMP/mirror"
      - name: Preserve transfer receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mirror-receipt-shared
          path: ${{ runner.temp }}/mirror/receipt.json
          if-no-files-found: warn
          retention-days: 30
