name: Publish approved PHP to GitHub
run-name: Publish PHP ${{ inputs.minor }} ${{ inputs.ticket }}
on:
  push:
    branches: [feature/oct-security-publication-20261021]
  workflow_dispatch:
    inputs:
      ticket:
        type: string
        required: true
      minor:
        required: true
        type: choice
        options: ["5.3", "5.4", "5.5", "5.6", "7.0", "7.1", "7.2", "7.3", "7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
permissions:
  contents: write
concurrency:
  group: oct-security-publication-${{ github.repository }}-${{ inputs.minor }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: oct-publication-20261021-${{ inputs.minor }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Publish approved package bytes
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_PACKAGE_ACCESS: ${{ secrets.PRIVATE_PACKAGE_ACCESS }}
          PHP_SERIES: ${{ inputs.minor }}
        run: python3 publication/publish.py publish "$PHP_SERIES"
      - name: Retain publication receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-${{ inputs.minor }}-${{ github.run_attempt }}
          path: receipts/
          if-no-files-found: warn
          retention-days: 90
  verify:
    if: github.event_name == 'workflow_dispatch'
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download and verify published files
        env:
          GH_TOKEN: ${{ github.token }}
          PHP_SERIES: ${{ inputs.minor }}
        run: python3 publication/publish.py verify "$PHP_SERIES"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-${{ inputs.minor }}-${{ github.run_attempt }}
          path: receipts/
          if-no-files-found: warn
          retention-days: 90
